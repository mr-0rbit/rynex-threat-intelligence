[project]
name = "rtip-backend"
version = "0.1.0"
description = "Rynex Threat Intelligence Platform - backend API and collection engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.29",
    "redis>=5.0",
    "celery>=5.4",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "bcrypt>=4.2",
    "pyotp>=2.9",
    "feedparser>=6.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.1",
    "slowapi>=0.1.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "aiohttp>=3.9",
    "ruff>=0.6",
    "pip-audit>=2.7",
    "PyYAML>=6.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
# Pin the rule set explicitly so lint results do not change when ruff expands
# its defaults. FastAPI's `Depends()`/`Query()` idioms trip bugbear's B008, and
# the broader B/I/UP/SIM families are not yet enforced repo-wide.
select = ["E4", "E7", "E9", "F"]
