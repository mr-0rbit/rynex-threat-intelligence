# Optional alternative when using Prometheus Operator. Do not apply alongside
# the static rtip-backend scrape in prometheus.yaml (that would double-scrape).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rtip-backend
  namespace: rtip
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rtip-backend
  endpoints:
    - port: http
      path: /api/v1/metrics
      interval: 30s
      scheme: http
      bearerTokenSecret:
        name: rtip-prometheus-credentials
        key: metrics-api-key
  namespaceSelector:
    matchNames:
      - rtip
