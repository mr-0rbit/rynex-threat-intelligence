# SMTP credentials are mounted from the rtip-alertmanager-credentials Secret.

global:
  resolve_timeout: 5m
  smtp_smarthost: smtp.rynex.tech:587
  smtp_from: alertmanager@rynex.tech
  smtp_auth_username: alertmanager
  smtp_auth_password_file: /etc/alertmanager/secrets/smtp-password
  smtp_require_tls: true

route:
  group_by: ["alertname", "team"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default
  routes:
    - matchers:
        - 'severity="critical"'
      receiver: critical-alerts
      continue: true
    - matchers:
        - 'team="security"'
      receiver: security-alerts

receivers:
  - name: default
    email_configs:
      - to: ops@rynex.tech
        send_resolved: true

  - name: critical-alerts
    email_configs:
      - to: oncall@rynex.tech
        send_resolved: true

  - name: security-alerts
    email_configs:
      - to: security@rynex.tech
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - 'severity="critical"'
    target_matchers:
      - 'severity="warning"'
    equal: ["alertname", "team"]
