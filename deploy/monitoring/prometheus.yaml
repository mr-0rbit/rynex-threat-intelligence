# Prometheus configuration rendered into a ConfigMap by
# deploy/monitoring/kustomization.yaml. The API key is mounted from a
# Kubernetes Secret; never place it in this file.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: rtip-backend
    metrics_path: /api/v1/metrics
    bearer_token_file: /etc/prometheus/secrets/metrics-api-key
    static_configs:
      - targets: ["rtip-backend:8000"]
