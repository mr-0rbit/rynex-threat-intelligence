apiVersion: v1
kind: ConfigMap
metadata:
  name: rtip-config
  namespace: rtip
data:
  ENVIRONMENT: "production"
  DEBUG: "false"
  API_V1_PREFIX: "/api/v1"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_LOGIN_MAX_ATTEMPTS: "10"
  RATE_LIMIT_LOGIN_WINDOW_SECONDS: "300"
  RETENTION_COLLECTION_JOBS_DAYS: "90"
  ALLOW_PRIVATE_NETWORK_SOURCES: "false"
  # Set this to the ingress-controller proxy pod/service CIDRs for the cluster.
  # An empty value intentionally disables trust in X-Forwarded-For.
  TRUSTED_PROXY_CIDRS: ""
  TAXII_ENABLED: "true"
  IOC_DECAY_ENABLED: "true"
  CORS_ORIGINS: '["https://rtip.rynex.tech"]'
# Secret rtip-secrets is deliberately not defined in this repository.
# Provision it from the cluster's external secret manager before deploying.
