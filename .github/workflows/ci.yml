name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . || pip install -r requirements.txt || true
          # Fallback: install from pyproject dependencies if no requirements file
          pip install fastapi uvicorn sqlalchemy aiosqlite alembic pydantic pydantic-settings \
            celery redis httpx pytest pytest-asyncio bcrypt pyjwt ruff
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Tests (pytest)
        run: pytest tests/ -q
        env:
          RATE_LIMIT_ENABLED: "false"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
